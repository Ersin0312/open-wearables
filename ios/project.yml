name: HealthCoach
options:
  bundleIdPrefix: com.ersin.healthcoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HealthCoach:
    type: application
    platform: iOS
    sources:
      - path: HealthCoach
    info:
      path: HealthCoach/Info.plist
      properties:
        CFBundleDisplayName: Health Coach
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Allow plain-HTTP to the local/Tailscale backend during development.
        # Tighten this once the backend is reachable over HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ersin.healthcoach
        TARGETED_DEVICE_FAMILY: "1"
